server:
  port: 8080

spring:
  application:
    name: EcommerceApplication

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db
    username: root
    password:  ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  logging:
    level:
      org.hibernate.tool.schema: DEBUG

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true

    graphql:
      graphiql:
        enabled: true





